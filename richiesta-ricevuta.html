<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Richiesta ricevuta | SolveX AI3D</title>
  <style>
    :root { color-scheme: light dark; font-family: Arial, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f5f7fb; color: #1d1d1f; }
    main { width: min(560px, calc(100% - 48px)); padding: 40px; border: 1px solid #d9e0ea; border-radius: 20px; background: #fff; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08); text-align: center; }
    h1 { margin-top: 0; }
    .button--explore { display: inline-block; margin-top: 12px; padding: 11px 19px; border: 1px solid #d95bc5; border-radius: 999px; background: transparent; color: #993588; text-decoration: none; font-weight: 700; }
    .button--explore:focus-visible { outline: 3px solid #006eac; outline-offset: 3px; }
    @media (prefers-color-scheme: dark) {
      .button--explore { color: #d95bc5; }
      .button--explore:focus-visible { outline-color: #45b6fe; }
    }
    .button--explore:active { background: #d95bc5; color: #fff; }
    @media (hover: hover) and (pointer: fine) {
      .button--explore:hover { background: #d95bc5; color: #fff; }
    }
    @media (forced-colors: active) {
      .button--explore, .button--explore:is(:hover, :active, :focus-visible) { border-color: ButtonText; background: ButtonFace; color: ButtonText; }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0b0b0d; color: #f5f5f7; }
      main { background: #1c1c1e; border-color: #34343a; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Richiesta ricevuta</h1>
    <p>Grazie, il modulo è stato inviato. Ti ricontatteremo appena possibile.</p>
    <a class="button button--explore" data-cta-role="explore" href="/">Torna al sito SolveX AI3D</a>
  </main>
</body>
</html>
